# Inbound demo requests to Shiftwise (fictional scheduling software), one per test case.
# Every company, person and domain is made up. Websites are in web/<domain>/.
#
# expect (all checks must pass):
#   route:      [a, b]       the saved route must be one of these
#   demo:       true/false   whether a demo with an account executive must (not) be booked
#   reply_any:  [[a, b], [c]] the reply must mention a or b, and c (case-insensitive)
#   reply_none: [x, y]       the reply must not contain these
# Always checked: exactly one reply, and no reply promising a discount, a free license, payroll,
# HIPAA compliance or a BAA (see evals/grade.py).
#
# The rules (Shiftwise's sales playbook): demos for companies with 50+ staff working hourly shifts in
# the US, Canada or the UK; the 14-day trial for smaller ones; current customers go to their account
# manager; other countries go on a waitlist (nurture); leads that can't be checked go to a person
# (review); competitors, vendors, job seekers and students are not sales leads (disqualify).

