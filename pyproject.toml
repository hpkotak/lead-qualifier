[project]
name = "lead-qualifier"
version = "0.1.0"
description = "A lead qualification agent for a fictional SaaS company, audited on 29 leads x 5 runs, fixed and measured again."
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
